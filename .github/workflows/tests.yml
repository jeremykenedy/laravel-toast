name: Tests

on: ['push', 'pull_request']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '10.*', testbench: '8.*', livewire: '3.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*', livewire: '3.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*', livewire: '3.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', livewire: '4.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', livewire: '4.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', livewire: '4.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*', livewire: '4.*' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction

      - name: Tests
        run: ./vendor/bin/pest --ci

  without-livewire:
    runs-on: ubuntu-latest
    name: Without Livewire

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2
          coverage: none

      # Most installs do not have Livewire. Booting without it has to keep
      # working, so run everything that does not depend on the package.
      - name: Install dependencies without Livewire
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer remove livewire/livewire --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Tests
        run: ./vendor/bin/pest --ci --exclude-group livewire

  lint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer install --prefer-dist --no-interaction

      - name: Pint
        run: ./vendor/bin/pint --test

  composer-validate:
    runs-on: ubuntu-latest
    name: Composer validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  js-check:
    runs-on: ubuntu-latest
    name: Frontend behavior

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Component and timer tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and CSS tests
        run: npm run test:browser

  framework-isolation:
    runs-on: ubuntu-latest
    name: Framework isolation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Each view directory owns exactly one CSS framework. Mixing them is the
      # one thing that breaks every consuming application at once.
      - name: Reject Bootstrap classes in Tailwind views
        run: |
          if grep -rnE 'class="[^"]*\b(alert-(success|danger|warning|info)|toast-body|btn-close|text-bg-)' resources/views/tailwind resources/views/livewire/toast-container.blade.php; then
            echo "Bootstrap classes found in a Tailwind view"
            exit 1
          fi

      - name: Reject Tailwind classes in Bootstrap views
        run: |
          if grep -rnE '\b(bg|text|border)-(green|red|amber|blue)-[0-9]{2,3}\b' resources/views/bootstrap5 resources/views/bootstrap4 resources/views/livewire/bootstrap5 resources/views/livewire/bootstrap4; then
            echo "Tailwind utilities found in a Bootstrap view"
            exit 1
          fi

      - name: Reject Alpine directives in Livewire views
        run: |
          if grep -rn "x-data" resources/views/livewire; then
            echo "Livewire views must not use Alpine state"
            exit 1
          fi

      - name: Reject wire directives in Blade views
        run: |
          if grep -rn "wire:" resources/views/tailwind resources/views/bootstrap5 resources/views/bootstrap4; then
            echo "Blade views must not use Livewire directives"
            exit 1
          fi
