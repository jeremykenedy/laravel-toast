<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" fill="none" role="img" aria-label="Laravel Toast">
  <title>Laravel Toast</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#60a5fa" stop-opacity=".10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <filter id="lift" x="-25%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".6"/>
    </filter>

    <clipPath id="card"><rect width="214" height="44" rx="9"/></clipPath>
  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <ellipse cx="668" cy="104" rx="180" ry="104" fill="url(#glow)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="60" y="80" fill="#fff" font-size="40" font-weight="700" letter-spacing="-.5">Laravel Toast</text>
    <text x="60" y="110" fill="#a8a29e" font-size="14">Toast notifications for every Laravel stack you ship.</text>

    <g transform="translate(60 128)" font-size="10" font-weight="500" text-anchor="middle">
      <rect width="92" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#4ade80" stroke-width=".8"/>
      <text x="46" y="14.5" fill="#4ade80">49 Animations</text>

      <rect x="100" width="64" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#60a5fa" stroke-width=".8"/>
      <text x="132" y="14.5" fill="#60a5fa">19 Props</text>

      <rect x="172" width="68" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#fbbf24" stroke-width=".8"/>
      <text x="206" y="14.5" fill="#fbbf24">15 Combos</text>

      <rect x="248" width="70" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#a78bfa" stroke-width=".8"/>
      <text x="283" y="14.5" fill="#a78bfa">Dark Mode</text>

      <rect x="326" width="38" height="22" rx="11" fill="#1a1a1a" opacity=".8" stroke="#f87171" stroke-width=".8"/>
      <text x="345" y="14.5" fill="#f87171">RTL</text>
    </g>

    <g filter="url(#lift)" transform="translate(562 34)">
      <g opacity=".6">
        <g clip-path="url(#card)">
          <rect width="214" height="44" fill="#0f1e33"/>
          <rect width="96" height="3" fill="#60a5fa" opacity=".85"/>
        </g>
        <rect width="214" height="44" rx="9" fill="none" stroke="#1e40af"/>
        <circle cx="21" cy="25" r="9" fill="#60a5fa" opacity=".2"/>
        <path d="M21 21.2v4.2m0 3.2h.01" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
        <text x="38" y="22" fill="#dbeafe" font-size="10" font-weight="600">Update available</text>
        <text x="38" y="34" fill="#dbeafe" font-size="9" opacity=".68">Version 2.1 is ready to install.</text>
        <path d="M0 0 6.5 6.5M6.5 0 0 6.5" transform="translate(190 21)" stroke="#dbeafe" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
      </g>

      <g transform="translate(0 52)" opacity=".82">
        <g clip-path="url(#card)">
          <rect width="214" height="44" fill="#2b1d06"/>
          <rect width="144" height="3" fill="#fbbf24" opacity=".9"/>
        </g>
        <rect width="214" height="44" rx="9" fill="none" stroke="#92400e"/>
        <circle cx="21" cy="25" r="9" fill="#fbbf24" opacity=".2"/>
        <path d="M21 20.8v4.4m0 3h.01" stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round"/>
        <text x="38" y="22" fill="#fef3c7" font-size="10" font-weight="600">Storage almost full</text>
        <text x="38" y="34" fill="#fef3c7" font-size="9" opacity=".68">You have used 92% of your quota.</text>
        <path d="M0 0 6.5 6.5M6.5 0 0 6.5" transform="translate(190 21)" stroke="#fef3c7" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
      </g>

      <g transform="translate(0 104)">
        <g clip-path="url(#card)">
          <rect width="214" height="44" fill="#082c1a"/>
          <rect width="188" height="3" fill="#4ade80"/>
        </g>
        <rect width="214" height="44" rx="9" fill="none" stroke="#166534"/>
        <circle cx="21" cy="25" r="9" fill="#4ade80" opacity=".22"/>
        <path d="m17.4 25 3 3 5.2-6.2" stroke="#86efac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="22" fill="#dcfce7" font-size="10" font-weight="600">Profile updated</text>
        <text x="38" y="34" fill="#dcfce7" font-size="9" opacity=".68">Your changes have been saved.</text>
        <path d="M0 0 6.5 6.5M6.5 0 0 6.5" transform="translate(190 21)" stroke="#dcfce7" stroke-width="1.3" stroke-linecap="round" opacity=".45"/>
      </g>
    </g>
  </g>
</svg>
