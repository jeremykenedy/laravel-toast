<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" fill="none" role="img" aria-label="Laravel Toast">
  <title>Laravel Toast</title>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#3b82f6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="lift" x="-25%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>

    <clipPath id="card"><rect width="214" height="44" rx="9"/></clipPath>
  </defs>

  <rect width="800" height="200" rx="16" fill="#fff" stroke="#e5e7eb"/>
  <ellipse cx="668" cy="104" rx="180" ry="104" fill="url(#glow)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="60" y="80" fill="#0f172a" font-size="40" font-weight="700" letter-spacing="-.5">Laravel Toast</text>
    <text x="60" y="110" fill="#64748b" font-size="14">Toast notifications for every Laravel stack you ship.</text>

    <g transform="translate(60 128)" font-size="10" font-weight="500" text-anchor="middle">
      <rect width="92" height="22" rx="11" fill="#f0fdf4" stroke="#22c55e" stroke-width=".8"/>
      <text x="46" y="14.5" fill="#166534">49 Animations</text>

      <rect x="100" width="64" height="22" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width=".8"/>
      <text x="132" y="14.5" fill="#1e40af">19 Props</text>

      <rect x="172" width="68" height="22" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width=".8"/>
      <text x="206" y="14.5" fill="#b45309">15 Combos</text>

      <rect x="248" width="70" height="22" rx="11" fill="#f5f3ff" stroke="#8b5cf6" stroke-width=".8"/>
      <text x="283" y="14.5" fill="#6d28d9">Dark Mode</text>

      <rect x="326" width="38" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width=".8"/>
      <text x="345" y="14.5" fill="#b91c1c">RTL</text>
    </g>

    <g filter="url(#lift)" transform="translate(562 34)">
      <g opacity=".6">
        <g clip-path="url(#card)">
          <rect width="214" height="44" fill="#eff6ff"/>
          <rect width="96" height="3" fill="#3b82f6" opacity=".75"/>
        </g>
        <rect width="214" height="44" rx="9" fill="none" stroke="#bfdbfe"/>
        <circle cx="21" cy="25" r="9" fill="#3b82f6" opacity=".14"/>
        <path d="M21 21.2v4.2m0 3.2h.01" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
        <text x="38" y="22" fill="#1e40af" font-size="10" font-weight="600">Update available</text>
        <text x="38" y="34" fill="#1e40af" font-size="9" opacity=".72">Version 2.1 is ready to install.</text>
        <path d="M0 0 6.5 6.5M6.5 0 0 6.5" transform="translate(190 21)" stroke="#1e40af" stroke-width="1.3" stroke-linecap="round" opacity=".35"/>
      </g>

      <g transform="translate(0 52)" opacity=".82">
        <g clip-path="url(#card)">
          <rect width="214" height="44" fill="#fffbeb"/>
          <rect width="144" height="3" fill="#f59e0b" opacity=".8"/>
        </g>
        <rect width="214" height="44" rx="9" fill="none" stroke="#fde68a"/>
        <circle cx="21" cy="25" r="9" fill="#f59e0b" opacity=".16"/>
        <path d="M21 20.8v4.4m0 3h.01" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
        <text x="38" y="22" fill="#b45309" font-size="10" font-weight="600">Storage almost full</text>
        <text x="38" y="34" fill="#b45309" font-size="9" opacity=".72">You have used 92% of your quota.</text>
        <path d="M0 0 6.5 6.5M6.5 0 0 6.5" transform="translate(190 21)" stroke="#b45309" stroke-width="1.3" stroke-linecap="round" opacity=".35"/>
      </g>

      <g transform="translate(0 104)">
        <g clip-path="url(#card)">
          <rect width="214" height="44" fill="#f0fdf4"/>
          <rect width="188" height="3" fill="#22c55e"/>
        </g>
        <rect width="214" height="44" rx="9" fill="none" stroke="#bbf7d0"/>
        <circle cx="21" cy="25" r="9" fill="#22c55e" opacity=".18"/>
        <path d="m17.4 25 3 3 5.2-6.2" stroke="#166534" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="22" fill="#166534" font-size="10" font-weight="600">Profile updated</text>
        <text x="38" y="34" fill="#166534" font-size="9" opacity=".72">Your changes have been saved.</text>
        <path d="M0 0 6.5 6.5M6.5 0 0 6.5" transform="translate(190 21)" stroke="#166534" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
      </g>
    </g>
  </g>
</svg>
